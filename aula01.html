   <div>
<br> 
   <button onclick="tocar()"> play </button>

    <script>   
        
        resenha = document.getElementById('musica');


     function trocar(){
        //resenha = document.getElementById('musica2');
        if(resenha == document.getElementById('musica')){
            resenha = document.getElementById('musica2');
            
        }
        else{
            resenha == document.getElementById('musica')
        }
    }


    function tocar() {
        //resenha = document.getElementById('musica');
        resenha.play();
    }
    function pausar(){
        //resenha = document.getElementById('musica');
        resenha.pause();
    }
    function mutar(){
        //resenha = document.getElementById('musica');
        resenha.muted = !resenha.muted;
    }
    function acelerar(){
        //resenha = document.getElementById('musica');
        resenha.playbackRate = 2.0 ;
    }
    function acelerarmais(){
        //resenha = document.getElementById('musica');
        resenha.playbackRate = 5.0 ;
    }
    function desacelerar(){
        //resenha = document.getElementById('musica');
        resenha.playbackRate = 1.0 ;
    }
    function readystate(){
        //resenha = document.getElementById('musica');
        alert(resenha.readyState);
    }
